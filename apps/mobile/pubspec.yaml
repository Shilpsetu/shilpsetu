name: shilpsetu
description: Market on-ramp for marginalised artisans. SIH 2026, PS 26090.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Persistence (ADR-0001: local DB is the UI source of truth)
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5

  # Network — the generated client (ADR-0005). Never hand-edit its lib/.
  shilpsetu_api:
    path: ../../packages/api_client_dart
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Capture + voice (Bet 01: no typing on the critical path)
  camera: ^0.11.0
  image: ^4.3.0
  record: ^5.2.0
  flutter_tts: ^4.2.0

  # On-device inference (ADR-0003)
  tflite_flutter: ^0.11.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.2
  drift_dev: ^2.21.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/
    - assets/icons/
