[project]
name = "karigar-backend"
version = "0.1.0"
description = "Karigar API - market on-ramp for marginalised artisans (SIH 2026, PS 26090)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",
]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
# Deliberately NOT enabling flake8-type-checking (TC): it wants runtime-needed
# Pydantic/FastAPI annotations moved into `if TYPE_CHECKING` blocks, which
# breaks schema generation in subtle ways and costs more review time than the
# import-time saving is worth. Revisit only if cold start becomes a problem.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "arq.*", "testcontainers.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires docker (postgres/redis)"]
