publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  camera: ^0.11.0
  connectivity_plus: ^6.1.0
  decimal: ^3.2.0
  dio: ^5.7.0
  drift: ^2.21.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.0
