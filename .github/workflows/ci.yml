name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest

      - name: Demo insurance — full flow must pass with providers mocked
        run: uv run pytest tests/test_api_smoke.py
        env:
          PROVIDER_PROFILE: mock

  mobile:
    name: mobile (analyze · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  contract:
    name: api contract (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install backend
        working-directory: apps/backend
        run: uv sync --locked

      - name: Generator tests
        working-directory: apps/backend
        run: uv run pytest ../../tools/test_gen_dart_client.py

      - name: Regenerate schema and client
        run: ./tools/gen_api.sh

      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --quiet -- packages/api_client_dart; then
            echo "::error::The committed API contract does not match the code."
            echo ""
            echo "Someone changed a FastAPI schema without regenerating."
            echo "Fix it locally:"
            echo ""
            echo "    ./tools/gen_api.sh"
            echo "    git add packages/api_client_dart && git commit"
            echo ""
            echo "Drift found:"
            git --no-pager diff -- packages/api_client_dart
            exit 1
          fi
          echo "Contract is current."
