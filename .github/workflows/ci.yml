name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest

      - name: Demo insurance — full flow must pass with providers mocked
        run: uv run pytest tests/test_api_smoke.py
        env:
          PROVIDER_PROFILE: mock

  mobile:
    name: mobile (analyze · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      # The native platform folders come from `flutter create .`, which the app
      # devs run once and commit. Until they land there is no app to analyse,
      # so the steps below skip instead of failing — a permanently red X on day
      # one only teaches a team to ignore CI. This switches itself on the moment
      # apps/mobile/android is committed.
      #
      # The check lives here rather than in a job-level `if:` because
      # hashFiles() needs a checked-out workspace, and job conditions are
      # evaluated before checkout. Putting it there makes the whole workflow
      # invalid, and then *no* jobs run at all.
      - name: Is the Flutter app scaffolded yet?
        id: scaffolded
        run: |
          if [ -d android ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile/android not found — skipping mobile checks until 'flutter create .' is committed."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.scaffolded.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Dependencies
        if: steps.scaffolded.outputs.ready == 'true'
        run: flutter pub get

      - name: Code generation
        if: steps.scaffolded.outputs.ready == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        if: steps.scaffolded.outputs.ready == 'true'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: steps.scaffolded.outputs.ready == 'true'
        run: flutter analyze --fatal-infos

      - name: Tests
        if: steps.scaffolded.outputs.ready == 'true'
        run: flutter test

  contract:
    name: api contract (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install backend
        working-directory: apps/backend
        run: uv sync --locked

      - name: Generator tests
        working-directory: apps/backend
        run: uv run pytest ../../tools/test_gen_dart_client.py

      - name: Regenerate schema and client
        run: bash tools/gen_api.sh

      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --quiet -- packages/api_client_dart; then
            echo "::error::The committed API contract does not match the code."
            echo ""
            echo "Someone changed a FastAPI schema without regenerating."
            echo "Fix it locally:"
            echo ""
            echo "    ./tools/gen_api.sh"
            echo "    git add packages/api_client_dart && git commit"
            echo ""
            echo "Drift found:"
            git --no-pager diff -- packages/api_client_dart
            exit 1
          fi
          echo "Contract is current."
