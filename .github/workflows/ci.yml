name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest

      - name: Demo insurance — full flow must pass with providers mocked
        run: uv run pytest tests/test_api_smoke.py
        env:
          PROVIDER_PROFILE: mock

  mobile:
    name: mobile (analyze · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # Guards ADR-0005: the committed Dart client must match the live OpenAPI
  # schema. Enable once the generator is wired in Phase 0.
  # contract:
  #   name: api client drift
  #   runs-on: ubuntu-latest
  #   steps: ...
