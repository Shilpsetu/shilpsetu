  tflite_flutter: ^0.11.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
